<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SML GAME — Онлайн-лига</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0b1a12;
    --bg-mid: #10321f;
    --line-color: rgba(255,255,255,0.12);
    --gold: #febe10;
    --text: #eef5ef;
    --text-dim: #a9c2ae;
    --green-rating: #4ade80;
    --danger: #ef4444;
  }

  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 50% -10%, #1e5a37 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(90deg, var(--line-color) 1px, transparent 1px),
      linear-gradient(0deg, var(--line-color) 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.3;
    z-index: 0;
  }

  .screen {
    display: none;
    position: relative;
    z-index: 1;
    padding: 24px 16px 60px;
    min-height: 100vh;
    animation: fadeIn .35s ease;
  }

  .screen.active { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .title-main {
    font-size: clamp(2.2rem, 8vw, 4rem);
    font-weight: 900;
    letter-spacing: 4px;
    text-align: center;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #7dd3a1 60%, #3a8b5f 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-dim);
    letter-spacing: 5px;
    text-transform: uppercase;
    font-size: .8rem;
    margin-bottom: 30px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 26px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .25s ease;
    background: linear-gradient(180deg, #2b7a4b 0%, #1d5a37 100%);
    color: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    text-transform: uppercase;
    width: 100%;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(74,222,128,0.35);
  }

  .btn:active:not(:disabled) { transform: translateY(0); }

  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .btn.secondary {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.25);
    color: var(--text);
  }

  .btn.secondary:hover:not(:disabled) {
    border-color: rgba(74,222,128,0.6);
  }

  .btn.danger {
    background: linear-gradient(180deg, #b91c1c, #7f1010);
  }

  .btn.danger:hover:not(:disabled) {
    box-shadow: 0 10px 28px rgba(239,68,68,0.4);
  }

  .menu-wrap {
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
  }

  .menu-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 30px;
  }

  .form-group {
    max-width: 420px;
    margin: 0 auto 14px;
    text-align: left;
  }

  .form-label {
    display: block;
    font-size: .8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.4);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color .2s ease;
  }

  .form-input:focus {
    border-color: var(--green-rating);
    box-shadow: 0 0 0 3px rgba(74,222,128,0.15);
  }

  .error-msg {
    max-width: 420px;
    margin: 10px auto;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(239,68,68,0.15);
    color: #fecaca;
    border-left: 3px solid var(--danger);
    font-size: .88rem;
    text-align: left;
  }

  .info-box {
    max-width: 420px;
    margin: 0 auto 20px;
    padding: 12px 16px;
    border-radius: 10px;
    background: rgba(74,222,128,0.08);
    border-left: 3px solid var(--green-rating);
    color: var(--text-dim);
    font-size: .85rem;
    text-align: left;
    line-height: 1.5;
  }

  /* Карточки команд */
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    max-width: 900px;
    margin: 20px auto 0;
  }

  .team-card {
    padding: 14px 12px;
    border-radius: 14px;
    background: linear-gradient(135deg, #1a4d2e 0%, #0e2a1a 100%);
    border: 2px solid rgba(74,222,128,0.25);
    cursor: pointer;
    transition: all .2s ease;
    text-align: center;
  }

  .team-card:hover {
    transform: translateY(-3px);
    border-color: var(--green-rating);
    box-shadow: 0 8px 22px rgba(74,222,128,0.25);
  }

  .team-card.taken {
    opacity: .4;
    cursor: not-allowed;
    filter: grayscale(1);
  }

  .team-card .tc-short {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .team-card .tc-name {
    font-size: .8rem;
    font-weight: 700;
    letter-spacing: .5px;
  }

  .team-card .tc-coach {
    font-size: .7rem;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Меню карьеры */
  .career-header {
    max-width: 480px;
    margin: 0 auto 20px;
    padding: 16px 20px;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.3));
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }

  .career-header .ch-nick {
    font-size: .8rem;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .career-header .ch-nick b { color: var(--gold); }

  .career-header .ch-team {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    max-width: 480px;
    margin: 0 auto;
  }

  .menu-grid .btn { padding: 16px 10px; font-size: .85rem; }

  .dev-badge {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 100;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--gold);
    color: #111;
    font-weight: 900;
    font-size: .7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #b91c1c;
    color: #fff;
    padding: 14px 24px;
    border-radius: 12px;
    font-weight: 700;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: transform .3s ease;
    z-index: 1000;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: #15803d; }

  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: .9rem;
  }
  .loading::after {
    content: "";
    display: inline-block;
    width: 16px; height: 16px;
    margin-left: 8px;
    border: 2px solid var(--green-rating);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===================== ЭКРАН 1: ГЛАВНОЕ МЕНЮ ===================== -->
<div id="screen-main" class="screen active">
  <h1 class="title-main">SML GAME</h1>
  <p class="subtitle">Онлайн-лига</p>

  <div class="menu-wrap">
    <div class="menu-actions">
      <button class="btn" onclick="enterCareer()">Карьера</button>
      <button class="btn secondary" onclick="showScreen('screen-devcode')">Аккаунт разработчика</button>
    </div>
  </div>
</div>

<!-- ===================== ЭКРАН 2: КОД РАЗРАБОТЧИКА ===================== -->
<div id="screen-devcode" class="screen">
  <h1 class="title-main" style="font-size:clamp(1.6rem,6vw,2.4rem)">Разработчик</h1>
  <p class="subtitle">Введите код доступа</p>

  <div class="form-group">
    <label class="form-label">Секретный код</label>
    <input id="dev-code-input" class="form-input" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
  </div>

  <div id="devcode-error" class="error-msg" style="display:none"></div>

  <div class="menu-wrap" style="margin-top:20px">
    <div class="menu-actions">
      <button class="btn" onclick="checkDevCode()">Войти</button>
      <button class="btn secondary" onclick="showScreen('screen-main')">← Назад</button>
    </div>
  </div>
</div>

<!-- ===================== ЭКРАН 3: МЕНЮ РАЗРАБОТЧИКА ===================== -->
<div id="screen-devmenu" class="screen">
  <div class="dev-badge">DEV</div>
  <h1 class="title-main" style="font-size:clamp(1.6rem,6vw,2.4rem)">Разработчик</h1>
  <p class="subtitle">Управление лигой</p>

  <div class="menu-wrap">
    <div class="menu-actions">
      <button class="btn" onclick="devCreateTournament()">Создать турнир</button>
      <button class="btn" onclick="devMyTournaments()">Мои турниры</button>
      <button class="btn secondary" onclick="devTeamsManage()">Управление командами</button>
      <button class="btn danger" onclick="devLogout()">Выйти из аккаунта</button>
    </div>
  </div>
</div>

<!-- ===================== ЭКРАН 4: РЕГИСТРАЦИЯ / ВХОД ===================== -->
<div id="screen-auth" class="screen">
  <h1 class="title-main" style="font-size:clamp(1.6rem,6vw,2.4rem)">Карьера</h1>
  <p class="subtitle" id="auth-subtitle">Регистрация тренера</p>

  <div class="info-box" id="auth-info" style="display:none">
    Аккаунт на этом устройстве не найден. Введите ник и пароль для регистрации.
  </div>

  <div class="form-group">
    <label class="form-label">Ваш ник</label>
    <input id="auth-nick" class="form-input" type="text" placeholder="Например: Ivan" autocomplete="off" maxlength="20">
  </div>

  <div class="form-group">
    <label class="form-label">Пароль</label>
    <input id="auth-pass" class="form-input" type="password" placeholder="минимум 4 символа" autocomplete="off">
  </div>

  <div id="auth-error" class="error-msg" style="display:none"></div>

  <div class="menu-wrap" style="margin-top:20px">
    <div class="menu-actions">
      <button class="btn" id="auth-btn" onclick="submitAuth()">Войти</button>
      <button class="btn secondary" onclick="showScreen('screen-main')">← Назад</button>
    </div>
  </div>
</div>

<!-- ===================== ЭКРАН 5: ВЫБОР КОМАНДЫ ===================== -->
<div id="screen-team-select" class="screen">
  <h1 class="title-main" style="font-size:clamp(1.5rem,5.5vw,2.2rem)">Выбери команду</h1>
  <p class="subtitle" id="ts-subtitle">Свободные клубы</p>

  <div id="team-select-grid" class="team-grid"></div>

  <div class="menu-wrap" style="margin-top:24px">
    <div class="menu-actions">
      <button class="btn secondary" onclick="logoutCareer()">Выйти из аккаунта</button>
    </div>
  </div>
</div>

<!-- ===================== ЭКРАН 6: МЕНЮ КАРЬЕРЫ ===================== -->
<div id="screen-career" class="screen">
  <div class="career-header">
    <div class="ch-nick">Тренер: <b id="career-nick">—</b></div>
    <div class="ch-team" id="career-team">—</div>
  </div>

  <div class="menu-grid">
    <button class="btn" onclick="careerStub('Состав')">Состав</button>
    <button class="btn" onclick="careerStub('Тактика')">Тактика</button>
    <button class="btn" onclick="careerStub('Трансферы')">Трансферы</button>
    <button class="btn" onclick="careerStub('Товарищеский матч')">Товарняк</button>
  </div>

  <div class="menu-wrap" style="margin-top:16px">
    <div class="menu-actions">
      <button class="btn" onclick="careerStub('Турниры')">Турниры</button>
      <button class="btn danger" onclick="leaveClub()">Покинуть клуб</button>
      <button class="btn secondary" onclick="logoutCareer()">Выйти из аккаунта</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   SML GAME — Онлайн-лига (этап 1)
   Supabase Auth + выбор команды + меню карьеры + меню разработчика
   ========================================================================= */

const SUPABASE_URL = "https://mrnarodofflopdcnyjyf.supabase.co";
const SUPABASE_KEY = "sb_publishable_9XmNuVIAq2vEMAm8MR3PSQ_p8fB1J3T";
const DEV_CODE = "1717";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const state = {
  user: null,          // объект auth.users
  profile: null,       // строка из таблицы profiles
  team: null,          // объект команды из teams
  isDev: false         // флаг — зашёл как разработчик
};

/* ------------------------- УТИЛИТЫ ------------------------- */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
  window.scrollTo({ top: 0 });
}

function toast(msg, isSuccess = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("success");
  if (isSuccess) t.classList.add("success");
  t.classList.add("show");
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => t.classList.remove("show"), 2600);
}

function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.display = "block";
}

function hideError(elId) {
  const el = document.getElementById(elId);
  el.style.display = "none";
}

/* ------------------------- ГЛАВНОЕ МЕНЮ ------------------------- */

async function enterCareer() {
  // Проверяем, есть ли активная сессия
  const { data: sessionData } = await sb.auth.getSession();

  if (sessionData.session) {
    // Есть сессия — проверяем профиль
    state.user = sessionData.session.user;
    const loaded = await loadProfile();
    if (loaded) {
      if (state.profile.team_id) {
        await loadTeam(state.profile.team_id);
        renderCareerMenu();
        showScreen("screen-career");
      } else {
        showScreen("screen-team-select");
        await renderTeamSelectGrid();
      }
      return;
    }
  }

  // Сессии нет — показываем форму регистрации/входа
  prepareAuthForm();
  showScreen("screen-auth");
}

function prepareAuthForm() {
  document.getElementById("auth-nick").value = "";
  document.getElementById("auth-pass").value = "";
  hideError("auth-error");
  document.getElementById("auth-info").style.display = "block";
  document.getElementById("auth-btn").textContent = "Зарегистрироваться";
  document.getElementById("auth-subtitle").textContent = "Регистрация тренера";
  showScreen("screen-auth");
}

/* ------------------------- АВТОРИЗАЦИЯ ------------------------- */

/**
 * Регистрация через Supabase Auth.
 * Ник превращаем в "email": nick@SML.local — обходной путь, т.к. Supabase требует email.
 * Пароль — как есть.
 */
function nickToEmail(nick) {
  return nick.trim().toLowerCase() + "@sml.local";
}

async function submitAuth() {
  hideError("auth-error");

  const nick = document.getElementById("auth-nick").value.trim();
  const pass = document.getElementById("auth-pass").value;

  if (nick.length < 2) return showError("auth-error", "Ник минимум 2 символа");
  if (!/^[a-zA-Zа-яА-Я0-9_]+$/.test(nick)) return showError("auth-error", "Ник: только буквы, цифры, _");
  if (pass.length < 4) return showError("auth-error", "Пароль минимум 4 символа");

  const email = nickToEmail(nick);
  const btn = document.getElementById("auth-btn");
  btn.disabled = true;

  try {
    // Сначала пробуем зайти
    let { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

    if (error) {
      // Не зашло — регистрируем
      const signUp = await sb.auth.signUp({ email, password: pass });
      if (signUp.error) throw signUp.error;
      data = signUp.data;

      // Создаём профиль
      await sb.from("profiles").insert({
        id: data.user.id,
        nickname: nick,
        role: "coach"
      });
    }

    state.user = data.user;

    // Загружаем профиль (может не сразу появиться — читаем повторно)
    const ok = await loadProfile();
    if (!ok) throw new Error("Не удалось загрузить профиль");

    // Проверяем, есть ли команда
    if (state.profile.team_id) {
      await loadTeam(state.profile.team_id);
      renderCareerMenu();
      showScreen("screen-career");
    } else {
      await renderTeamSelectGrid();
      showScreen("screen-team-select");
    }

  } catch (e) {
    console.error(e);
    if (e.message && e.message.includes("Invalid login")) {
      showError("auth-error", "Неверный ник или пароль");
    } else if (e.message && e.message.includes("User already registered")) {
      showError("auth-error", "Этот ник уже занят");
    } else {
      showError("auth-error", "Ошибка: " + (e.message || "неизвестно"));
    }
  } finally {
    btn.disabled = false;
  }
}

async function loadProfile() {
  if (!state.user) return false;
  const { data, error } = await sb.from("profiles").select("*").eq("id", state.user.id).single();
  if (error || !data) return false;
  state.profile = data;
  return true;
}

async function loadTeam(teamId) {
  const { data, error } = await sb.from("teams").select("*").eq("id", teamId).single();
  if (!error && data) state.team = data;
}

/* ------------------------- ВЫБОР КОМАНДЫ ------------------------- */

async function renderTeamSelectGrid() {
  const grid = document.getElementById("team-select-grid");
  grid.innerHTML = `<div class="loading">Загружаем команды</div>`;

  const { data: teams, error } = await sb
    .from("teams")
    .select("id, name, short, is_free, coach_id")
    .order("name");

  if (error || !teams) {
    grid.innerHTML = `<div class="error-msg">Не удалось загрузить команды: ${error?.message || ""}</div>`;
    return;
  }

  grid.innerHTML = "";
  teams.forEach(t => {
    const card = document.createElement("div");
    card.className = "team-card" + (t.is_free ? "" : " taken");
    card.innerHTML = `
      <div class="tc-short">${t.short}</div>
      <div class="tc-name">${t.name}</div>
      ${!t.is_free ? `<div class="tc-coach">занята</div>` : ""}
    `;
    if (t.is_free) {
      card.onclick = () => pickTeam(t.id);
    }
    grid.appendChild(card);
  });
}

async function pickTeam(teamId) {
  try {
    // Атомарно: обновляем команду, только если она ещё свободна
    const { data, error } = await sb
      .from("teams")
      .update({ coach_id: state.user.id, is_free: false })
      .eq("id", teamId)
      .eq("is_free", true)
      .select()
      .single();

    if (error || !data) {
      toast("Эту команду уже заняли");
      await renderTeamSelectGrid();
      return;
    }

    // Обновляем профиль
    await sb.from("profiles").update({ team_id: teamId }).eq("id", state.user.id);
    state.profile.team_id = teamId;
    state.team = data;

    toast("Команда выбрана!", true);
    renderCareerMenu();
    showScreen("screen-career");
  } catch (e) {
    console.error(e);
    toast("Ошибка выбора команды");
  }
}

/* ------------------------- МЕНЮ КАРЬЕРЫ ------------------------- */

function renderCareerMenu() {
  document.getElementById("career-nick").textContent = state.profile.nickname;
  document.getElementById("career-team").textContent = state.team ? state.team.name : "—";
}

function careerStub(name) {
  toast(`${name}: скоро появится`);
}

async function leaveClub() {
  if (!confirm("Точно покинуть клуб? Команда станет свободной, но состав и тактика сохранятся.")) return;

  try {
    // Освобождаем команду
    await sb.from("teams").update({ coach_id: null, is_free: true }).eq("id", state.team.id);
    // Открепляем от профиля
    await sb.from("profiles").update({ team_id: null }).eq("id", state.user.id);
    state.profile.team_id = null;
    state.team = null;

    toast("Вы покинули клуб", true);
    await renderTeamSelectGrid();
    showScreen("screen-team-select");
  } catch (e) {
    console.error(e);
    toast("Ошибка выхода из клуба");
  }
}

async function logoutCareer() {
  await sb.auth.signOut();
  state.user = null;
  state.profile = null;
  state.team = null;
  toast("Вы вышли из аккаунта", true);
  showScreen("screen-main");
}

/* ------------------------- РАЗРАБОТЧИК ------------------------- */

async function checkDevCode() {
  hideError("devcode-error");
  const code = document.getElementById("dev-code-input").value.trim();
  if (code !== DEV_CODE) {
    return showError("devcode-error", "Неверный код");
  }

  // Запоминаем, что мы разработчик, и идём в меню разработчика
  state.isDev = true;
  localStorage.setItem("sml_dev", "1");

  document.getElementById("dev-code-input").value = "";
  showScreen("screen-devmenu");
}

function devCreateTournament() { toast("Создание турнира: скоро"); }
function devMyTournaments() { toast("Мои турниры: скоро"); }
function devTeamsManage() { toast("Управление командами: скоро"); }

function devLogout() {
  state.isDev = false;
  localStorage.removeItem("sml_dev");
  toast("Вы вышли из аккаунта разработчика", true);
  showScreen("screen-main");
}

/* ------------------------- ИНИЦИАЛИЗАЦИЯ ------------------------- */

async function init() {
  // Если ранее заходил как разработчик — показываем его меню сразу
  if (localStorage.getItem("sml_dev") === "1") {
    state.isDev = true;
    showScreen("screen-devmenu");
    return;
  }

  // Проверяем активную сессию игрока
  const { data } = await sb.auth.getSession();
  if (data.session) {
    state.user = data.session.user;
    const ok = await loadProfile();
    if (ok && state.profile.team_id) {
      await loadTeam(state.profile.team_id);
      renderCareerMenu();
      showScreen("screen-career");
      return;
    }
    if (ok && !state.profile.team_id) {
      await renderTeamSelectGrid();
      showScreen("screen-team-select");
      return;
    }
  }

  showScreen("screen-main");
}

init();
</script>
